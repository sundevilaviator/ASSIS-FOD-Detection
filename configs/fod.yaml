# ASSIS FOD Module — configuration
# Single source of truth for class list, size-bucket thresholds, and default
# training hyperparameters, so the training script, benchmark script, and
# Streamlit app all agree on the same definitions.

# Classes used for this training run. Runs 1-4 used only the first 5 below
# (large/high-contrast objects, deliberately, to validate the pipeline
# end-to-end before tackling harder small objects). Run 5 (2026-09-04)
# extends this to FOD-A's small-fastener classes, which are the actual
# small-object gap this module targets — see docs/GAP_ANALYSIS_SUMMARY.md.
#
# IMPORTANT PROVENANCE NOTE: the fastener names below (Bolt, Washer, Nut,
# BoltWasher, BoltNutSet, Screw, Nail) were confirmed present via
# src/voc_to_yolo.py --list-classes-only against the Pascal VOC MIRROR
# distribution only (docs/RESEARCH_LOG.md, 2026-08-19: 33,793 XML files
# scanned, 31 distinct class names found). Run 5 actually trains on the
# separate ORIGINAL-FORMAT 400x400 distribution (see the 2026-08-31 findings
# in RESEARCH_LOG — the two distributions are NOT filename-compatible and
# the mirror is known to have dropped 70 images versus the original). The
# two almost certainly share the same underlying label vocabulary (same
# source dataset, repackaged), but that has NOT yet been independently
# re-confirmed against the original-format distribution's own XML files —
# Run 5's notebook re-runs the class scan against the actual training
# source before locking in this list, per this project's "verify, don't
# assume a check on one dataset transfers to another" rule.
classes:
  - Wrench
  - Hammer
  - Screwdriver
  - SodaCan
  - Wood
  - Bolt          # 3,300 objects in the confirmed class scan
  - Washer        # 2,139 objects
  - Nut           # 1,303 objects
  - BoltWasher    # 1,017 objects
  - BoltNutSet    # 514 objects
  - Screw         # 157 objects
  - Nail          # present in the confirmed class scan; object count not
                  # yet tallied (the earlier count only covered the other
                  # fastener classes) — Run 5's own dataset-layout step
                  # will report the real number before training starts.

# FOD-A's full label set is larger still (Pliers, Wire, PlasticPart,
# LuggageTag, Cutter, Label, Battery, MetalPart, PaintChip, ClampPart,
# LuggagePart, Rock, FuelCap, AdjustableClamp, Pen, AdjustableWrench,
# MetalSheet, Hose, Tape, and others — see the 2026-08-31 scan in
# docs/RESEARCH_LOG.md for the full list with counts). Not included here;
# add further classes the same way — confirm the count first, then extend.

# Bounding-box area, as a percent of total image area, used to bucket
# detections into FAA-AC-style size classes for reporting. This is a PIXEL-AREA
# proxy, not a physical centimeter measurement (see README "known limitation").
# Buckets are intentionally aligned to the AC 150/5220-24 reference objects:
#   - "small"  ~ approximates the 3.1-4.3 cm reference cylinder/sphere class
#   - "medium" ~ approximates up to the 10.2 cm (4 in) AC size-distribution cutoff
#   - "large"  ~ anything bigger (large debris, wildlife, vehicle parts, etc.)
size_buckets:
  small:
    max_area_pct: 0.5
  medium:
    max_area_pct: 2.0
  large:
    max_area_pct: null   # no upper bound

# FAA AC 150/5220-24 pass/fail reference values used by src/benchmark_faa.py.
# Every value below was verified against the primary source on 2026-08-31:
# FAA AC 150/5220-24, "Airport Foreign Object Debris (FOD) Detection Equipment",
# dated 09/30/2009. Section references are to that document. Do not change a
# number here without re-reading the cited section.
faa_ac_150_5220_24:
  # AC 150/5220-24 section 3.2.b(1)(c): "90 percent of the following group of objects when
  # placed within a 100 ft by 100 ft (30 m by 30 m) square in the desired
  # coverage area... each item must measure no larger than 4 in (10 cm) in any
  # dimension". NOTE: the AC's 90% applies to a SPECIFIED GROUP of ten object
  # types (asphalt chunk, runway light portion, crescent wrench, deep socket,
  # tyre rubber, distorted metal strip, fuel cap, lug nut, hydraulic line, PVC
  # pipe) - not to arbitrary small debris. This module applies the figure to a
  # bounding-box-area "small" bucket, which is a related but NOT identical
  # test. Reported as such; see docs/FAA_AC_150_5220-24_BENCHMARK.md.
  min_detection_rate_small_object: 0.90
  # AC 150/5220-24 section 3.2.b(7)(a)(i): "one per day as averaged over any 90 day period, for
  # FOD detection systems with visual detection capabilities"
  max_false_alarms_per_day_visual: 1
  # AC 150/5220-24 section 3.2.b(7)(a)(ii): three per day, same averaging, without visual
  # detection capabilities
  max_false_alarms_per_day_non_visual: 3
  # AC 150/5220-24 section 3.2.b(2): "location information for a detected object that is within
  # 16 ft (5.0 m) of the actual FOD object location"
  max_location_error_m: 5.0
  # AC 150/5220-24 section 3.2.b(1)(d): "Any two of the objects above, located no more than
  # 10 ft (3 m) apart from each other, identified as separate objects"
  multi_object_min_separation_m: 3.0
  # AC 150/5220-24 section 3.2.b(1): reference objects the system must detect outright -
  # an unpainted metal cylinder 1.2 in (3.1 cm) high by 1.5 in (3.8 cm)
  # diameter, and a 1.7 in (4.3 cm) sphere (a standard golf ball).
  # AC 150/5220-24 section 3.2.b(1): mobile systems must meet this at a minimum 20 mph (30 km/h).
  # AC 150/5220-24 section 3.2.b(6): systems "must demonstrate the detection performance under
  # both clear and inclement weather conditions", with site-specific specs for
  # clear, inclement, and post-storm recovery time.
  # AC 150/5220-24 section 3.2.b(6)(c): "All systems must demonstrate detection performance
  # during daylight, nighttime, and dawn/dusk operations."
  #   -> The lighting and weather stratification this repo reports is therefore
  #      demonstrating something the AC REQUIRES, not a reporting refinement
  #      invented here. See docs/GAP_ANALYSIS_SUMMARY.md.

# Default training hyperparameters (Ultralytics YOLOv8).
training:
  model: yolov8s.pt      # small object performance benefit over yolov8n at
                          # modest extra cost; swap to yolov8n.pt for faster
                          # iteration on CPU/Colab free tier
  imgsz: 960              # higher than the YOLO default (640) to preserve
                          # small-object detail; increase further if GPU memory allows
  epochs: 100
  batch: 16
  patience: 25
  optimizer: auto
  # copy_paste pastes extra object instances into training images — applied
  # from the start (not added later after seeing a problem), since Phase 1
  # showed underrepresented classes (gloves) never recovered once training
  # started without enough of them in view. This is a direct, proactive
  # application of that lesson to Phase 2's small-object classes.
  copy_paste: 0.3
  # Lighting-variation augmentation, increased above the Ultralytics default
  # (0.4), as a partial, honest mitigation for the environmental-robustness
  # gap (day/dusk/artificial-light variation in camera footage). This is
  # NOT a substitute for real night/rain footage or thermal fusion — it
  # only widens the brightness/contrast distribution the model sees during
  # training. Documented as partial in docs/RESEARCH_LOG.md, not claimed as
  # "all-weather" anywhere.
  hsv_v: 0.5
  seed: 42
  # Loss-weighting nudge toward small objects; Ultralytics doesn't expose a
  # native "small-object weight," so this is implemented via oversampling in
  # data_prep.py rather than a loss-function change — documented in
  # docs/RESEARCH_LOG.md as the current approach and a place for future work.
